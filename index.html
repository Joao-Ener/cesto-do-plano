<style>
/* Layout: one-column phone app, sticky header with tabs at the bottom; product rows show the guide's own photo strip */
:root{
  --navy:#1f3a63; --navy-2:#2d5288; --leaf:#2f8f5b; --heart:#d2445e; --warn:#c7811a;
  --bg:#f3f6fa; --card:#ffffff; --fg:#17233a; --muted:#5c6b82; --line:#dbe3ee; --chip:#e7eef8; --img:#ffffff;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#9fbbe6; --navy-2:#c3d5f1; --leaf:#5cc68a; --heart:#ff7a90; --warn:#f0b04a;
  --bg:#0f1622; --card:#172233; --fg:#e7edf6; --muted:#9aa8bd; --line:#26364d; --chip:#20304a; --img:#f4f6f9; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#9fbbe6; --navy-2:#c3d5f1; --leaf:#5cc68a; --heart:#ff7a90; --warn:#f0b04a;
  --bg:#0f1622; --card:#172233; --fg:#e7edf6; --muted:#9aa8bd; --line:#26364d; --chip:#20304a; --img:#f4f6f9; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:600;font-size:1.45rem;margin:0;color:var(--navy);letter-spacing:.2px}
.sub{color:var(--muted);font-size:.82rem}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0;color:var(--navy);text-wrap:balance}
.search{width:100%;font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.search:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--navy-2);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.8}
.view{display:grid;gap:14px}
details.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.cat>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary h2{flex:1;min-width:0}
.caret{width:18px;height:18px;color:var(--muted);transition:transform .2s}
details[open]>summary .caret{transform:rotate(90deg)}
.count{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.items{display:grid}
.item{border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:8px}
.item .row{display:flex;gap:10px;align-items:flex-start}
.item .txt{flex:1;min-width:0}
.item .name{font-weight:600}
.item .note{color:var(--muted);font-size:.82rem}
.strip{display:block;width:100%;background:var(--img);border-radius:10px;border:1px solid var(--line);padding:4px;cursor:zoom-in;overflow:hidden}
.strip img{display:block;height:74px;width:auto;max-width:100%;object-fit:contain;margin:0 auto}
.acts{display:flex;gap:6px;align-items:center;flex-shrink:0}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:22px;height:22px}
.ib.fav[aria-pressed="true"]{color:var(--heart);border-color:var(--heart)}
.ib.fav[aria-pressed="true"] svg path{fill:currentColor}
.ib.cart[aria-pressed="true"]{color:#fff;background:var(--leaf);border-color:var(--leaf)}
.qty{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.qty button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:1.1rem;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-weight:600}
.pill{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--warn);color:var(--warn);margin-left:6px;vertical-align:2px}
.brandnote{width:100%;font:inherit;font-size:.88rem;padding:8px 10px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--fg)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
/* Lista */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.progress{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.progress i{display:block;height:100%;background:var(--leaf);transition:width .25s}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:.88rem;font-weight:600;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.btn.danger{color:var(--heart);border-color:var(--heart)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.li input[type=checkbox]{width:24px;height:24px;accent-color:var(--leaf);flex-shrink:0}
.li .txt{flex:1;min-width:0}
.li.done .name{text-decoration:line-through;color:var(--muted)}
.li .thumb{width:84px;height:48px;object-fit:contain;background:var(--img);border-radius:8px;flex-shrink:0}
.grp{font-family:var(--display);font-size:.95rem;color:var(--navy);margin:6px 0 0}
.x{background:none;border:0;color:var(--muted);font-size:1.3rem;cursor:pointer;width:32px;height:32px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:50}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem}
/* Plano */
.meal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.meal .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.macros{display:flex;gap:6px;flex-wrap:wrap}
.macros span{font-size:.75rem;background:var(--chip);padding:3px 8px;border-radius:99px;font-variant-numeric:tabular-nums}
.opt{border-left:3px solid var(--chip);padding-left:10px;display:grid;gap:4px}
.opt b{font-size:.88rem;color:var(--navy-2)}
.opt ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.9rem}
.notes{font-size:.88rem;color:var(--muted)}
.notes ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.summary div{background:var(--chip);border-radius:12px;padding:10px 4px}
.summary strong{display:block;font-family:var(--display);font-size:1.2rem;color:var(--navy);font-variant-numeric:tabular-nums}
.summary small{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.4px}
/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{font:inherit;font-size:.78rem;font-weight:600;background:none;border:0;color:var(--muted);padding:9px 4px 10px;display:grid;justify-items:center;gap:2px;cursor:pointer;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--navy)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--leaf);color:#fff;font-size:.68rem;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
/* Lightbox */
.lb{position:fixed;inset:0;z-index:60;background:rgba(10,16,28,.88);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px;cursor:zoom-out}
.lb figure{margin:0;display:grid;gap:10px;max-width:100%}
.lb img{background:#fff;border-radius:12px;max-width:100%;max-height:70vh;object-fit:contain}
.lb figcaption{color:#fff;font-family:var(--display);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

</nav>

/* ---------- state ---------- */
const KEY="cesto-plano-v1";
let S={fav:{},cart:{},bought:{},note:{},custom:[]};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} updateBadge();}

const ITEMS={}; CATALOG.forEach(c=>c.items.forEach(i=>{i.cat=c.id;ITEMS[i.id]=i;}));
const CATNAME=Object.fromEntries(CATALOG.map(c=>[c.id,c.n]));
let tab="produtos", filter="todos", query="", openCats=new Set();
try{openCats=new Set(JSON.parse(sessionStorage.getItem(KEY+"-open")||"[]"));}catch(e){}

const $=s=>document.querySelector(s);
const IMG1=/^(lacteos|proteicas|queijos|recheios|pao|cereais)-/;
const imgPath=id=>(IMG1.test(id)?"img/":"img2/")+id+".webp";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const HEART='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-9.2-9A5 5 0 0 1 12 6a5 5 0 0 1 9.2 5C19 15.6 12 20 12 20z"/></svg>';
const CART='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1.2"/><circle cx="17" cy="20.5" r="1.2"/></svg>';
const CARET='<svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';

function cartIds(){return Object.keys(S.cart).filter(id=>S.cart[id]>0&&ITEMS[id]);}
function updateBadge(){const n=Object.keys(S.cart).filter(id=>S.cart[id]>0).filter(id=>!S.bought[id]).length;const b=$("#badge");b.textContent=n;b.hidden=n===0;}

let toastT; function toast(msg){let t=$(".toast"); if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);} t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200);}

/* ---------- Produtos ---------- */
function toolbarProdutos(){
  const nf=Object.keys(S.fav).filter(k=>S.fav[k]).length, nc=cartIds().length;
  $("#toolbar").innerHTML=`<input id="q" class="search" type="search" placeholder="Procurar (ex.: iogurte, wrap, atum)" value="${esc(query)}" aria-label="Procurar produtos">
  <div class="chips" role="group" aria-label="Filtro">
    <button class="chip" data-f="todos" aria-pressed="${filter==="todos"}">Todos</button>
    <button class="chip" data-f="fav" aria-pressed="${filter==="fav"}">Gosto <span class="n">${nf}</span></button>
    <button class="chip" data-f="cart" aria-pressed="${filter==="cart"}">Para comprar <span class="n">${nc}</span></button>
  </div>`;
  $("#q").addEventListener("input",e=>{query=e.target.value;renderView();});
  document.querySelectorAll(".chip[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;render();});
}
function itemHTML(i){
  const q=S.cart[i.id]||0, f=!!S.fav[i.id];
  return `<div class="item" data-id="${i.id}">
    <div class="row">
      <div class="txt"><div class="name">${esc(i.n)}${i.m?'<span class="pill" title="Modera o consumo">Moderar</span>':""}</div>${i.d?`<div class="note">${esc(i.d)}</div>`:""}</div>
      <div class="acts">
        <button class="ib fav" aria-pressed="${f}" aria-label="Gosto de ${esc(i.n)}" data-act="fav">${HEART}</button>
        ${q>0?`<div class="qty"><button data-act="dec" aria-label="Menos">−</button><span>${q}</span><button data-act="inc" aria-label="Mais">+</button></div>`:""}
        <button class="ib cart" aria-pressed="${q>0}" aria-label="${q>0?"Tirar da lista":"Pôr na lista de compras"}" data-act="cart">${CART}</button>
      </div>
    </div>
    <button class="strip" data-act="zoom" aria-label="Ver produtos sugeridos: ${esc(i.n)}"><img loading="lazy" src="${imgPath(i.id)}" alt="Produtos sugeridos: ${esc(i.n)}"></button>
    ${(f||q>0||S.note[i.id])?`<input class="brandnote" id="note-${i.id}" data-act="note" placeholder="Marca/sabor preferido (ex.: Mimosa morango)" value="${esc(S.note[i.id]||"")}">`:""}
  </div>`;
}
function renderProdutos(){
  const qn=norm(query.trim());
  let html="", total=0;
  CATALOG.forEach(c=>{
    let its=c.items.filter(i=>{
      if(filter==="fav"&&!S.fav[i.id])return false;
      if(filter==="cart"&&!(S.cart[i.id]>0))return false;
      if(qn&&!norm(i.n+" "+i.d+" "+c.n+" "+(S.note[i.id]||"")).includes(qn))return false;
      return true;});
    if(!its.length)return;
    total+=its.length;
    const open=qn||filter!=="todos"||openCats.has(c.id);
    const nsel=c.items.filter(i=>S.fav[i.id]||S.cart[i.id]>0).length;
    html+=`<details class="cat" data-cat="${c.id}" ${open?"open":""}><summary><h2>${esc(c.n)}</h2><span class="count">${nsel?nsel+" escolhidos · ":""}${its.length}</span>${CARET}</summary><div class="items">${its.map(itemHTML).join("")}</div></details>`;
  });
  if(!total) html=`<div class="empty">${filter==="fav"?"Ainda não marcaste nenhum produto com o coração. Toca no coração dos produtos de que gostas.":filter==="cart"?"A lista está vazia. Toca no carrinho de um produto para o pôr na lista.":"Nenhum produto encontrado."}</div>`;
  $("#view").innerHTML=html;
  document.querySelectorAll("details.cat").forEach(d=>d.addEventListener("toggle",()=>{
    if(qn||filter!=="todos")return; d.open?openCats.add(d.dataset.cat):openCats.delete(d.dataset.cat);
    try{sessionStorage.setItem(KEY+"-open",JSON.stringify([...openCats]));}catch(e){}
  }));
}
function itemAction(id,act,el){
  if(act==="fav"){S.fav[id]=!S.fav[id]; if(!S.fav[id])delete S.fav[id];}
  else if(act==="cart"){ if(S.cart[id]>0){delete S.cart[id];delete S.bought[id];} else {S.cart[id]=1; toast("Adicionado à lista de compras");}}
  else if(act==="inc"){S.cart[id]=(S.cart[id]||0)+1;}
  else if(act==="dec"){S.cart[id]=(S.cart[id]||1)-1; if(S.cart[id]<=0){delete S.cart[id];delete S.bought[id];}}
  else if(act==="zoom"){const i=ITEMS[id];return lightbox(`${imgPath(id)}`,i.n);}
  save();
  const node=el.closest(".item"); if(node){node.outerHTML=itemHTML(ITEMS[id]);}
  toolbarProdutos(); refreshCounts();
}
function refreshCounts(){
  document.querySelectorAll("details.cat").forEach(d=>{
    const c=CATALOG.find(x=>x.id===d.dataset.cat); const nsel=c.items.filter(i=>S.fav[i.id]||S.cart[i.id]>0).length;
    const n=d.querySelectorAll(".item").length; d.querySelector(".count").textContent=(nsel?nsel+" escolhidos · ":"")+n;});
}
function lightbox(src,cap){
  const d=document.createElement("div");d.className="lb";d.setAttribute("role","dialog");d.setAttribute("aria-label",cap);
  d.innerHTML=`<figure><img src="${src}" alt="${esc(cap)}"><figcaption>${esc(cap)} · toca para fechar</figcaption></figure>`;
  d.onclick=()=>d.remove(); document.addEventListener("keydown",function k(e){if(e.key==="Escape"){d.remove();document.removeEventListener("keydown",k);}});
  document.body.appendChild(d);
}

/* ---------- Lista ---------- */
let confirmClear=false;
function listText(){
  const lines=["Lista de compras"];
  const groups=groupCart();
  groups.forEach(([cat,rows])=>{lines.push("",cat.toUpperCase());rows.forEach(r=>lines.push(`${r.done?"✔":"•"} ${r.qty>1?r.qty+"× ":""}${r.name}${r.note?" ("+r.note+")":""}`));});
  return lines.join("\n");
}
function groupCart(){
  const map=new Map();
  CATALOG.forEach(c=>c.items.forEach(i=>{ if(S.cart[i.id]>0){ if(!map.has(c.n))map.set(c.n,[]); map.get(c.n).push({id:i.id,name:i.n,note:S.note[i.id]||"",qty:S.cart[i.id],done:!!S.bought[i.id],img:`${imgPath(i.id)}`});}}));
  const extra=S.custom.map(x=>({id:x.id,name:x.n,note:"",qty:S.cart[x.id]||1,done:!!S.bought[x.id],custom:true}));
  if(extra.length) map.set("Outros",extra);
  return [...map.entries()];
}

      ${done?`<button class="btn" id="clearDone">Retirar os já comprados</button>`:""}
      ${all.length?(confirmClear?`<span class="confirm">Esvaziar a lista toda? <button class="btn danger" id="clearYes">Sim, esvaziar</button><button class="btn" id="clearNo">Cancelar</button></span>`:`<button class="btn danger" id="clearAll">Esvaziar lista</button>`):""}
    </div></section>`;
  if(!all.length){
    html+=`<div class="empty">A lista de compras está vazia.<br>Vai a <b>Produtos</b> e toca no carrinho dos produtos que precisas de comprar${favNotIn?", ou usa o botão acima para juntar os teus favoritos":""}.</div>`;
  } else {
    html+=`<section class="panel">`+groups.map(([cat,rows])=>`<h3 class="grp">${esc(cat)}</h3>`+rows.map(r=>`
      <label class="li ${r.done?"done":""}" data-id="${r.id}">
        <input type="checkbox" id="chk-${r.id}" ${r.done?"checked":""}>
        ${r.img?`<img class="thumb" src="${r.img}" alt="" loading="lazy">`:""}
        <span class="txt"><span class="name">${r.qty>1?`<b>${r.qty}×</b> `:""}${esc(r.name)}</span>${r.note?`<br><span class="note">${esc(r.note)}</span>`:""}</span>
        ${r.custom?`<button class="x" data-del="${r.id}" aria-label="Remover ${esc(r.name)}">×</button>`:""}
      </label>`).join("")).join("")+`</section>`;
  }
  $("#view").innerHTML=html;

  $("#addfav")&&($("#addfav").onclick=()=>{Object.keys(S.fav).forEach(id=>{if(S.fav[id]&&ITEMS[id]&&!(S.cart[id]>0))S.cart[id]=1;});save();renderLista();toast("Favoritos adicionados à lista");});
  $("#copy")&&($("#copy").onclick=()=>{const t=listText();
    const fallback=()=>{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Lista copiada");}catch(e){toast("Não foi possível copiar");}ta.remove();};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast("Lista copiada"),fallback);else fallback();});
  $("#clearDone")&&($("#clearDone").onclick=()=>{Object.keys(S.bought).forEach(id=>{if(S.bought[id]){delete S.cart[id];delete S.bought[id];S.custom=S.custom.filter(x=>x.id!==id);}});save();renderLista();toast("Comprados retirados da lista");});
  $("#clearAll")&&($("#clearAll").onclick=()=>{confirmClear=true;renderLista();});
  $("#clearNo")&&($("#clearNo").onclick=()=>{confirmClear=false;renderLista();});
  $("#clearYes")&&($("#clearYes").onclick=()=>{confirmClear=false;S.cart={};S.bought={};S.custom=[];save();renderLista();toast("Lista esvaziada");});
  document.querySelectorAll(".li input[type=checkbox]").forEach(cb=>cb.onchange=()=>{const id=cb.closest(".li").dataset.id;if(cb.checked)S.bought[id]=true;else delete S.bought[id];save();renderLista();});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{e.preventDefault();const id=b.dataset.del;S.custom=S.custom.filter(x=>x.id!==id);delete S.cart[id];delete S.bought[id];save();renderLista();});
}

/* ---------- Plano ---------- */
function renderPlano(){
  $("#toolbar").innerHTML="";
  const mac=m=>`<div class="macros"><span>${m[0]} kcal</span><span>Proteína ${m[1]} g</span><span>Hidratos ${m[2]} g</span><span>Gordura ${m[3]} g</span></div>`;
  let html=`<section class="panel"><h2>Resumo diário</h2>
    <div class="summary"><div><strong>2445</strong><small>kcal</small></div><div><strong>144 g</strong><small>Proteína</small></div><div><strong>278 g</strong><small>Hidratos</small></div><div><strong>78 g</strong><small>Gordura</small></div></div>
    <div class="notes">Em cada refeição escolhe 1 opção de cada linha para construíres uma refeição completa. Os pesos das refeições principais são do alimento já preparado. Hidratação: 2,5–3,5 L de líquidos por dia; a urina não deve ser mais escura do que o nível 3.</div></section>`;
  PLAN.meals.forEach(m=>{
    html+=`<section class="meal"><div class="head"><h2>${m.n}</h2></div>${mac(m.m)}
      ${m.opts.map(o=>`<div class="opt"><b>${esc(o.t)}</b><ul>${o.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}
      ${m.notes?`<div class="notes"><b>Notas</b><ul>${m.notes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}</section>`;
  });
  html+=`<section class="panel"><h2>Porção de fruta</h2><div class="notes">${esc(PLAN.fruit)}</div></section>
  <p class="sub" style="text-align:center">Plano alimentar preparado pelo nutricionista Pedro Salazar. Objetivo: otimização da composição corporal.</p>`;
  $("#view").innerHTML=html;
}

/* ---------- shell ---------- */
const TITLES={produtos:"Os meus produtos",lista:"Lista de compras",plano:"Plano alimentar"};
function renderView(){ if(tab==="produtos")renderProdutos(); else if(tab==="lista")renderLista(); else renderPlano(); }
function render(){
  $("#title").textContent=TITLES[tab];
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  if(tab==="produtos")toolbarProdutos(); renderView(); updateBadge();
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;confirmClear=false;try{history.replaceState(null,"","#"+tab);}catch(e){} render();window.scrollTo(0,0);});
$("#view").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.dataset.act==="note")return;const it=b.closest(".item");if(!it)return;e.preventDefault();itemAction(it.dataset.id,b.dataset.act,b);});
$("#view").addEventListener("input",e=>{if(e.target.dataset&&e.target.dataset.act==="note"){const id=e.target.closest(".item").dataset.id;const v=e.target.value;if(v)S.note[id]=v;else delete S.note[id];save();}});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TITLES[h]&&h!==tab){tab=h;render();}});
{const h=location.hash.slice(1); if(TITLES[h])tab=h;}
if(!openCats.size) openCats.add(CATALOG[0].id);
render();
if("serviceWorker" in navigator && !/claude|claudeusercontent/.test(location.hostname)){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
